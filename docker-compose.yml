# Divine Astro — production stack.
#
#   caddy  : TLS termination. Gets a real certificate from Let's Encrypt on
#            first boot and renews it. No certbot cron, no manual renewal.
#   app    : the FastAPI service. Never exposed to the internet directly.
#   db     : Postgres. Not published on a host port — only the app can reach it.
#   ollama : the local model. Writes the Starter's emailed answers (DIVASTRO-155,
#            app/emailed_answers.py, qwen2.5:7b) and is the chat narration's
#            fallback when Anthropic is unreachable (app/llm.py). Same
#            no-published-port posture as db — Ollama has no auth of its own, so
#            exposing 11434 to the internet would let anyone run inference (and
#            rack up your CPU bill) for free. cpus/mem_limit keep it from
#            starving the website and the other apps on this shared box.
#   wa     : WhatsApp Channel connector (DIVASTRO-116). Posts the daily
#            Panchang to the owner's own channel as a linked device on a
#            dedicated number (unofficial; see deploy/daily_channels.md
#            section 5). No published port: only the app reaches it, as
#            http://wa:3000, with the ASTRO_WA_TOKEN shared secret. Without
#            that token it idles and never contacts WhatsApp.
#
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: astro
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astro"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately no `ports:` — the database is reachable only on the
    # compose network. Exposing 5432 is how databases end up in breach reports.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASTRO_DATABASE_URL: postgresql+psycopg://astro:${POSTGRES_PASSWORD}@db:5432/astro
      ASTRO_COOKIE_SECURE: "1"     # HTTPS only — Caddy terminates TLS
      ASTRO_DEV_LOGIN: "0"         # never in production
    env_file:
      - .env
    volumes:
      # Chart wheel/PDF scratch space and the geo index cache.
      - appdata:/srv/data
    expose:
      - "8000"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Bound to the SERVER's own loopback only, not published to the internet —
    # same reasoning as db above (Ollama has no auth of its own). This lets an
    # admin reach it for testing via `ssh -L 11434:127.0.0.1:11434 ...`; the
    # app itself uses http://ollama:11434 on the compose network either way.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    environment:
      # DIVASTRO-155: ONE model in memory, ever. The OOM kill seen before came from
      # qwen2.5:3b and qwen2.5:7b loaded side by side; with this a request for
      # another model unloads the first. One request at a time (the emailed-answer
      # worker sends one job at a time anyway).
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Keep the model loaded between queued jobs (loading 7b from disk costs
      # ~20-40 s), then give the ~5.5 GB back to the box.
      OLLAMA_KEEP_ALIVE: "15m"
      # The narration prompt is ~1.5-2.5k tokens plus up to 1000 out: an older
      # default context of 2048 would silently cut the prompt.
      OLLAMA_CONTEXT_LENGTH: "4096"
    # DIVASTRO-155: at most one of the VM's 2 cores, so the website always keeps
    # one. Generation is CPU-bound: expect roughly half the uncapped 3.1 tok/s.
    cpus: "1.0"
    mem_limit: 7g              # qwen2.5:7b (Q4, 4.7 GB on disk) runs in ~5.5 GB with
                                # a 4k context: fits ONE model with headroom. Leaves
                                # room for app/db/caddy + the other docker projects
                                # on this box (9.3GB was free when sized, 2026-09-29)
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  wa:
    build: ./wa
    restart: unless-stopped
    environment:
      # Only what it needs, not the whole .env (no DB password, no API keys).
      # Interpolated from .env by compose; blank = idle.
      ASTRO_WA_TOKEN: ${ASTRO_WA_TOKEN:-}
    volumes:
      # The linked-device credentials. Treat like a password: whoever has
      # this volume can post as the number. `docker volume rm` = unlinked.
      - wadata:/data
    mem_limit: 300m
    # Deliberately no `ports:` — reachable only on the compose network.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./marketing:/srv/marketing:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:
  ollamadata:
  wadata:
